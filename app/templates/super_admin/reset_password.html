{% extends "base.html" %}

{% block title %}Reset mot de passe{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Reinitialiser mot de passe</h3>
                </div>
                <div class="card-body">
                    <p><strong>Microfinance :</strong> {{ tenant.name }}</p>
                    <p><strong>Utilisateur :</strong> {{ user.first_name }} {{ user.last_name }}</p>
                    <p><strong>Email :</strong> {{ user.email }}</p>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nouveau mot de passe</label>
                            <input type="password" name="new_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmer</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Reinitialiser</button>
                            <a href="{{ url_for('super_admin.view_tenant', id=tenant.id) }}" class="btn btn-secondary mt-2">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
