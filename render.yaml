services:
  - type: web
    name: microf-medilogic
    runtime: python
    repo: https://github.com/votre-compte/microf-medilogic
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: microf_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: SESSION_SECURE
        value: True

databases:
  - name: microf_db
    plan: free